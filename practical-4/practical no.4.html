<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tiny</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3e9e6;
    --header: #3b5068;
    --header-text: #ffffff;
    --header-sub: #dbe4ee;
    --card: #fbf6f4;
    --card-border: #eadfdb;
    --text: #1f2a37;
    --muted: #6b7280;
    --pill: #cfe3f3;
    --accent: #3b8fd9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1f27; --header: #2d3f55; --header-text: #fff; --header-sub: #b9c7d8;
      --card: #252b36; --card-border: #323a48; --text: #e8edf3; --muted: #9aa6b5;
      --pill: #2f4963; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1f27; --header: #2d3f55; --header-text: #fff; --header-sub: #b9c7d8;
    --card: #252b36; --card-border: #323a48; --text: #e8edf3; --muted: #9aa6b5;
    --pill: #2f4963; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  header {
    background: var(--header); color: var(--header-text);
    border-radius: 18px; padding: 22px 16px; text-align: center;
  }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 2rem; font-weight: 600; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
    display: grid; place-items: center;
  }
  .logo::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  header p { margin: 6px 0 0; color: var(--header-sub); font-size: 1rem; }

  /* flex: wrap + gap */
  .cards {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
    margin: 32px 0 24px;
  }
  .card {
    flex: 1 1 180px; max-width: 230px; text-align: center;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px 12px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
  .card h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; }

  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 28px; }
  .pill {
    background: var(--pill); border-radius: 999px; padding: 8px 18px; font-size: 1rem;
  }

  footer { text-align: center; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 8px; }
  footer .dot { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: inline-block; }

  /* media query: resize the window to see it work */
  @media (max-width: 600px) {
    .brand { font-size: 1.6rem; }
    .card { max-width: none; flex-basis: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="logo"></span><span>tiny</span></div>
      <p>inline · internal · flex · media</p>
    </header>

    <section class="cards">
      <!-- inline CSS demo: style attribute -->
      <div class="card"><h2 style="color:#d9304f;">📌 inline</h2><p>style attr</p></div>
      <div class="card"><h2>📐 internal</h2><p>&lt;style&gt;</p></div>
      <div class="card"><h2>🔗 external</h2><p>in head</p></div>
      <div class="card"><h2>🌀 flex</h2><p>wrap + gap</p></div>
    </section>

    <section class="pills">
      <span class="pill">📱 resize</span>
      <span class="pill">📏 media</span>
    </section>

    <footer><span class="dot"></span> responsive · all css</footer>
  </div>
</body>
</html>
