<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Registration - SIT Nagpur</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #ff512f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            border-top: 8px solid #ff512f;
        }
        header h2 {
            margin-top: 0;
            margin-bottom: 22px;
            color: #1e3c72;
            font-size: 23px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #2a5298;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 2px solid #d0dcf0;
            background-color: #f4f8ff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            color: #333333;
            transition: border-color 0.3s, background-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff512f;
            background-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #ff512f 0%, #dd2476 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(221, 36, 118, 0.4);
        }
    </style>
</head>
<body>

    <main class="form-container">
        <header>
            <h2>Event Registration - SIT Nagpur</h2>
        </header>

        <section>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="college">College Name</label>
                    <input type="text" id="college" name="college" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>
                </div>

                <div class="form-group">
                    <label for="event">Select Event</label>
                    <select id="event" name="event" required>
                        <option value="" disabled selected></option>
                        <option value="hackathon">Hackathon</option>
                        <option value="coding">Coding Competition</option>
                        <option value="robotics">Robotics Workshop</option>
                        <option value="paper">Paper Presentation</option>
                    </select>
                </div>

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

</body>
</html>
